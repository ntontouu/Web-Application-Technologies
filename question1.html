<!DOCTYPE html>
<html>
<body>
<!-- Προσθήκη onclick attribute που καλεί την myFunction() -->
<button onclick="myFunction()">Click Me</button>
<p id="demo"></p>  
<script> 
function myFunction() { 
    // Αλλαγή του περιεχομένου της παραγράφου με id="demo"
    document.getElementById("demo").innerHTML = "Hello World"; 
} 
</script> 
</body>
</html>
